<!DOCTYPE html>
<html lang="en">
    <head>
        <title>AOS Wayline Management</title>
        <link rel="icon" type="image/x-icon" href="img\favicon-32x32.png">
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script src="leaflet.rotatedMarker.min.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css"/>
        <link rel="stylesheet" type="text/css" href="bootstrap.css"/>
      </head>
<body class="w-100">
    <script src="bootstrap.bundle.min.js"></script>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-8" id="map"></div>
            
            <div class="col-4 d-flex flex-column justify-content-between" id="sidebar">
                <div class="m-2">
                    <div class="row my-1 border border-primary rounded">
                        <h6 id="selectedMarkerDiv" class="text-primary p-2 m-0 text-center">No waypoint selected.</h6>
                    </div>
                    <div class="row my-1">
                            <div class="col-auto">
                                <label class="col-form-label fs-6 fw-bold col-auto" for="droneSelect">drone</label>
                            </div>
                            <div class="col">
                                <select class="form-select col-auto" id="droneSelect" aria-label="drone select">
                                    <option value="" selected>select drone...</option>
                                    <option value="1">drone 1</option>
                                    <option value="2">drone 2</option>
                                    <option value="3">drone 3</option>
                                    <option value="4">drone 4</option>
                                    <option value="5">drone 5</option>
                                    <option value="6">drone 6</option>
                                    <option value="7">drone 7</option>
                                    <option value="8">drone 8</option>
                                    <option value="9">drone 9</option>
                                    <option value="10">drone 10</option>
                                </select>
                            </div>
                    </div>

                    <div class="row my-1">
                            <div class="col-auto">
                                <label class="col-form-label fs-6 fw-bold" for="latitude">latitude</label>
                            </div>
                            <input class="col form-control" type="text" id="latitude">
                            <div class="col-auto">
                                <label class="col-form-label fs-6 fw-bold" for="longitude">longitude</label>
                            </div>
                            <input class="col form-control" type="text" id="longitude">
                    </div>
                    <div class="row my-1">
                        <div class="col-auto">
                            <label class="col-form-label fs-6 fw-bold" for="altitudeInput">altitude [m]</label>
                        </div>
                        <input type="number" min="0" step="1" class="col form-control" id="altitudeInput">
                        <div class="col-auto">
                            <label class="col-form-label fs-6 fw-bold" for="speedInput">speed [m/s]</label>
                        </div>
                        <input type="number" min="0.0001" step="0.5" class="col form-control" id="speedInput">
                    </div>
                    <div class="row my-1">
                        <div class="col">
                            <label class="form-label fs-6 fw-bold" for="cameraSelect">camera</label>
                            <select class="form-select" aria-label="Camera select" id="cameraSelect">
                                <option selected value="">select camera...</option>
                                <option value="wide angle">wide angle</option>
                                <option value="tele">tele</option>
                                <option value="thermal image">thermal</option>

                            </select>
                        </div>
                        <div class="col">
                            <label class="form-label fs-6 fw-bold" for="holdInput">hold on position [s]</label>
                            <input type="number" min="0" step="1" class="form-control" id="holdInput">
                        </div>
                    </div>
                    <!-- New buttons added here -->
                    <div class="row my-1">
                        <div class="col-6">
                            <button id="integrationButton" type="button" class="btn w-100" data-state="off">Integration: Off</button>
                        </div>
                        <div class="col-6">
                            <button id="anomalyButton" type="button" class="btn w-100" data-state="off">Anomaly: Off</button>
                        </div>
                    </div>
                    <div class="row my-1">
                        <div class="col">
                            <label class="form-label fs-6 fw-bold" for="gimbalPitchInput">gimbal pitch [°]</label>
                            <form class="row m-1 items-center">
                                <input class="form-control col pl-2" id="gimbalPitchInput" min="0" value="0" max="360" type="number">
                            </form>
                        </div>
                        <div class="col">
                            <label class="form-label fs-6 fw-bold" for="gimbalYawInput">gimbal yaw [°]</label>
                            <form class="row m-1 items-center">
                                <input class="form-control col pl-2" id="gimbalYawInput" min="0" value="0" max="360" type="number">
                            </form>
                        </div>
                        <div class="col">
                            <label class="form-label fs-6 fw-bold" for="headingInput">heading [°]</label>
                            <form class="row m-1 items-center">
                                <input class="form-control col pl-2" id="headingInput" min="0" value="0" max="360" type="number">
                            </form>
                        </div>
                    </div>
                    <div class="row my-1">
                        <div class="col">
                            <label class="form-label fs-6 fw-bold" for="integrationWindowInput">Integration Window [sampling]</label>
                            <form class="row m-1 items-center">
                                <input class="form-control col pl-2" id="integrationWindowInput" min="0" value="30" max="100" type="number">
                            </form>
                        </div>
                        <div class="col">
                            <label class="form-label fs-6 fw-bold" for="minposeDistanceInput">Sampling Distance [m]</label>
                            <form class="row m-1 items-center">
                                <input class="form-control col pl-2" id="minposeDistanceInput" min="0.0" value="0.5" max="10.0" step="0.1" type="number">
                            </form>
                        </div>
                    </div>
                    
                    <div class="row mt-1">
                        <!-- <button id="updateWaypoint" type="button" class="btn btn-primary col m-1">Update waypoint</button> -->
                        <button class="btn btn-primary col m-1" id="showAnimation" type="button" value="show">Hide animation</button>
                        <button id="showWaylines" type="button" value="show" class="btn btn-primary col m-1">Hide waylines</button>
                    </div>
                    <!-- <div class="row my-1">
                        <button class="btn btn-primary col m-1" id="showAnimation" type="button" value="show">Hide animation</button>
                    </div> -->
                    <div id="rangeSliderDiv" class="row">
                        <label for="droneAnimationSlider" class="col-form-label text-center m-0">Time line</label>
                        <input type="range" class="form-range m-0" min="0" step="1" max="1" value="0" id="droneAnimationSlider">
                    </div>
                </div>
                
                <div class="row m-2">
                    <button id="sendWaypointsBtn" type="button" class="btn btn-primary">Send waypoints to server</button>
                </div>

                <div class="row m-2">
                    <button id="removeAllExceptLastBtn" type="button" class="btn btn-warning my-1">Remove path except last wp</button>
                    <button id="removeMarkerBtn" type="button" class="btn btn-warning my-1">Remove waypoint</button>

                    <button id="removeAllMarkerOfDroneIdBtn" type="button" class="btn btn-warning my-1">Remove waypoints of selected drone-id</button>
                    <button id="removeAllMarkerBtn" type="button" class="btn btn-danger text-white my-1">Remove all waypoints</button>
                    
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
